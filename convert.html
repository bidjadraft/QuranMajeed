<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحويل WebM إلى MP4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Tajawal', 'Amiri', sans-serif;
            background: linear-gradient(135deg, #022c22 0%, #064e3b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 { color: #c5a059; text-align: center; margin-bottom: 30px; font-size: 24px; }
        .upload-box {
            border: 2px dashed rgba(197, 160, 89, 0.5);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .upload-box:active {
            border-color: #c5a059;
            background: rgba(197, 160, 89, 0.1);
            transform: scale(0.98);
        }
        .btn {
            background: linear-gradient(45deg, #c5a059, #e2c28a);
            color: #022c22;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 20px; text-align: center; color: #fff; font-size: 14px; }
        input[type="file"] { display: none; }
        .file-info {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            color: #fff;
        }
        .spinner { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #output {
            background: #000;
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            max-height: 200px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        #output .log-info { color: #0f0; }
        #output .log-warn { color: #ff0; }
        #output .log-error { color: #f00; }
        #output .log-success { color: #0ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 تحويل WebM إلى MP4</h1>
        
        <div id="uploadBox" class="upload-box" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-cloud-upload-alt" style="font-size: 48px; color: #c5a059;"></i>
            <p style="color: #fff; margin-top: 15px; font-size: 16px;">اضغط لاختيار ملف WebM من الهاتف</p>
            <p style="color: rgba(255,255,255,0.6); font-size: 12px;">سيتم التحويل محليًا بدون سيرفر</p>
        </div>
        
        <input type="file" id="fileInput" accept=".webm,video/webm">
        
        <div id="fileInfo" class="file-info" style="display: none;">
            <p style="margin: 0 0 10px 0; font-size: 13px; color: rgba(255,255,255,0.8);">الملف المختار:</p>
            <p id="fileName" style="margin: 0 0 5px 0; font-weight: bold; color: #c5a059;"></p>
            <p id="fileSize" style="margin: 0; font-size: 12px; color: rgba(255,255,255,0.7);"></p>
        </div>
        
        <button id="convertBtn" class="btn" disabled>
            <i class="fas fa-sync-alt"></i> تحويل إلى MP4
        </button>
        
        <div id="status" class="status"></div>
        <div id="output"></div>
    </div>

    <script type="module">
        import { createFFmpeg, fetchFile } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/+esm';

        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const status = document.getElementById('status');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBox = document.getElementById('uploadBox');
        const output = document.getElementById('output');

        let selectedFile = null;
        let ffmpeg = null;
        let ffmpegLoaded = false;

        // دالة السجل - تعرض كل شيء في المربع الأسود
        const log = (message, type = 'info') => {
            const timestamp = new Date().toLocaleTimeString('ar-DZ');
            const colorClass = `log-${type}`;
            output.innerHTML += `<span class="${colorClass}">[${timestamp}] ${message}</span>
`;
            output.scrollTop = output.scrollHeight;
            console.log(`[${type.toUpperCase()}]`, message);
        };

        // بداية البرنامج
        log('🚀 بدء البرنامج...', 'info');
        status.innerHTML = '<span class="spinner">⏳</span> جاري تحميل ffmpeg.wasm... هذا قد يستغرق دقيقة (25 ميجابايت)';
        log('جاري تحميل مكتبة ffmpeg.wasm من CDN...', 'info');

        // تحميل ffmpeg
        async function loadFFmpeg() {
            try {
                log('إنشاء مثيل ffmpeg...', 'info');
                ffmpeg = createFFmpeg({ 
                    log: true,
                    logger: (data) => {
                        if (data.message) {
                            log(data.message, 'info');
                        }
                    },
                    corePath: 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/ffmpeg-core.js'
                });
                log('جاري تحميل ffmpeg في الذاكرة...', 'info');
                
                await ffmpeg.load();
                ffmpegLoaded = true;
                log('✅ ffmpeg تم تحميله بنجاح!', 'success');
                log(`الحالة: ffmpeg.isLoaded() = ${ffmpeg.isLoaded()}`, 'success');
                
                status.innerHTML = '✅ ffmpeg جاهز! اضغط على المربع لاختيار ملف WebM';
                
                // تفعيل زر التحويل إذا كان ملف محدد مسبقًا
                if (selectedFile) {
                    convertBtn.disabled = false;
                    log('زر التحويل مُفعّل لأن هناك ملف مختار', 'success');
                }
                
            } catch (error) {
                log('❌ خطأ في تحميل ffmpeg: ' + error.message, 'error');
                status.innerHTML = `❌ فشل تحميل ffmpeg<br><small>${error.message}</small>`;
                console.error('FFmpeg load error:', error);
            }
        }

        // ابدأ التحميل فورًا
        loadFFmpeg();

        // عند اختيار ملف
        fileInput.addEventListener('change', (e) => {
            log(`Event triggered: fileInput onchange`, 'info');
            
            if (!e.target.files || e.target.files.length === 0) {
                log('❌ لا توجد ملفات مختارة', 'error');
                return;
            }
            
            selectedFile = e.target.files[0];
            log(`ملف مختار: ${selectedFile.name}`, 'success');
            log(`نوع الملف: ${selectedFile.type || 'unknown'}`, 'info');
            log(`الحجم: ${(selectedFile.size / 1024 / 1024).toFixed(2)} ميجابايت`, 'info');
            log(`LastModified: ${new Date(selectedFile.lastModified).toISOString()}`, 'info');
            
            fileName.textContent = selectedFile.name;
            fileSize.textContent = `الحجم: ${(selectedFile.size / 1024 / 1024).toFixed(2)} ميجابايت`;
            fileInfo.style.display = 'block';
            uploadBox.style.display = 'none';
            
            // التحقق من نوع الملف
            if (!selectedFile.name.toLowerCase().endsWith('.webm')) {
                log('⚠️ تحذير: الملف ليس بامتداد .webm', 'warn');
            }
            
            // تفعيل زر التحويل إذا كان ffmpeg جاهزًا
            if (ffmpegLoaded && ffmpeg && ffmpeg.isLoaded()) {
                convertBtn.disabled = false;
                log('✅ ffmpeg جاهز + ملف مختار → زر التحويل مُفعّل', 'success');
            } else {
                log('⚠️ ffmpeg غير جاهز بعد، الزر سيبقى معطلًا', 'warn');
                if (ffmpeg) {
                    log(`ffmpeg.isLoaded() = ${ffmpeg.isLoaded()}', 'info');
                }
            }
            
            status.innerHTML = '✅ ملف جاهز! اضغط "تحويل إلى MP4"';
        });

        // عند الضغط على زر التحويل
        convertBtn.addEventListener('click', async () => {
            log('=' .repeat(50), 'info');
            log('🎬 بدأ عملية التحويل...', 'info');
            log('=' .repeat(50), 'info');
            
            if (!selectedFile) {
                log('❌ خطأ: لا يوجد ملف مختار!', 'error');
                return;
            }
            
            if (!ffmpeg || !ffmpegLoaded || !ffmpeg.isLoaded()) {
                log('❌ خطأ: ffmpeg غير جاهز!', 'error');
                if (ffmpeg) {
                    log(`hhhhhhhhhhhhhhhhhhhhhhhh: ffmpeg.isLoaded() = ${ffmpeg.isLoaded()}', 'error');
                }
                return;
            }

            convertBtn.disabled = true;
            const inputName = 'input.webm';
            const outputName = 'output.mp4';

            try {
                log('خطوة 1/4: قراءة الملف من الذاكرة...', 'info');
                const fileData = await fetchFile(selectedFile);
                log(`تم قراءة الملف: ${fileData.byteLength} بايت`, 'success');
                
                log('خطوة 2/4: كتابة الملف في نظام ملفات ffmpeg...', 'info');
                ffmpeg.FS('writeFile', inputName, fileData);
                log(`تم الكتابة: ${inputName}`, 'success');
                
                // التحقق من الملف
                const stats = ffmpeg.FS('stat', inputName);
                log(`حجم الملف في ffmpeg: ${stats.size} بايت`, 'info');

                log('خطوة 3/4: جاري التحويل بالإعدادات التالية:', 'info');
                log('  - فيديو: H264 (libx264) - CRF 23 - preset medium', 'info');
                log('  - صوت: AAC - 192kbps', 'info');
                log('  - flags: +faststart (للعمل على الويب)', 'info');
                
                status.innerHTML = '<span class="spinner">⏳</span> جاري التحويل... انتظر حتى ينتهي';
                
                await ffmpeg.run(
                    '-i', inputName,
                    '-c:v', 'libx264',
                    '-preset', 'medium',
                    '-crf', '23',
                    '-c:a', 'aac',
                    '-b:a', '192k',
                    '-movflags', '+faststart',
                    outputName
                );
                
                log('✅ffmpeg就绪portantlyinucceeded!', 'success');

                log('خطوة 4/4: قراءة الملف الناتج...', 'info');
                const data = ffmpeg.FS('readFile', outputName);
                log(`تم القراءة: ${data.byteLength} بايت (${(data.byteLength / 1024 / 1024).toFixed(2)} ميجابايت)`, 'success');

                log('جاري إنشاء Blob للتحميل...', 'info');
                const mp4Blob = new Blob([data.buffer], { type: 'video/mp4' });
                log(`Blob Created: ${mp4Blob.size} bytes, type: ${mp4Blob.type}`, 'success');
                
                const url = URL.createObjectURL(mp4Blob);
                log(`URL.createObjectURL(): ${url}`, 'success');
                
                const downloadName = selectedFile.name.replace(/.webm$/i, '.mp4');
                log(`اسم التحميل: ${downloadName}`, 'info');

                const a = document.createElement('a');
                a.href = url;
                a.download = downloadName;
                document.body.appendChild(a);
                
                log('ج軌 التحميل...', 'info');
                a.click();
                log('✅ تم النقر على عنصر التحميل', 'success');

                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    log('تم تنظيف الذاكرة (revokeObjectURL)', 'success');
                    
                    log('جاري تنظيف ملفات ffmpeg...', 'info');
                    try {
                        ffmpeg.FS('unlink', inputName);
                        ffmpeg.FS('unlink', outputName);
                        log('تم حذف الملفات المؤقتة', 'success');
                    } catch(e) {
                        log(`تحذير: فشل تنظيف بعض الملفات: ${e.message}`, 'warn');
                    }
                    
                    status.innerHTML = '✅ <strong>تم التحويل بنجاح!</strong><br>⊗ تم تحميل <strong>' + downloadName + '</strong>';
                    convertBtn.disabled = false;
                    
                    log('=' .repeat(50), 'success');
                    log('🎉 انتهت العملية بنجاح!', 'success');
                    log('=' .repeat(50), 'success');

                }, 100);

            } catch (error) {
                log('❌ خطأ في العملية:', 'error');
                log(`نوع الخطأ: ${error.name || 'unknown'}`, 'error');
                log(`الرسالة: ${error.message}`, 'error');
                log(`الStack: ${error.stack || 'N/A'}`, 'error');
                
                status.innerHTML = `❌ <strong>خطأ:</strong> ${error.message}`;
                convertBtn.disabled = false;
                
                console.error('Full error:', error);
            }
        });
    </script>
</body>
</html>
