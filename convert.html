<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحويل WebM إلى MP4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Tajawal', 'Amiri', sans-serif;
            background: linear-gradient(135deg, #022c22 0%, #064e3b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        h1 { color: #c5a059; text-align: center; margin-bottom: 30px; font-size: 24px; }
        .upload-box {
            border: 2px dashed rgba(197, 160, 89, 0.5);
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }
        .upload-box:active {
            border-color: #c5a059;
            background: rgba(197, 160, 89, 0.1);
            transform: scale(0.98);
        }
        .btn {
            background: linear-gradient(45deg, #c5a059, #e2c28a);
            color: #022c22;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .status { margin-top: 20px; text-align: center; color: #fff; font-size: 14px; }
        input[type="file"] { display: none; }
        .file-info {
            background: rgba(197, 160, 89, 0.1);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            color: #fff;
        }
        .spinner { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        #output {
            background: #000;
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 تحويل WebM إلى MP4</h1>
        
        <div id="uploadBox" class="upload-box" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-cloud-upload-alt" style="font-size: 48px; color: #c5a059;"></i>
            <p style="color: #fff; margin-top: 15px; font-size: 16px;">اضغط لاختيار ملف WebM من الهاتف</p>
            <p style="color: rgba(255,255,255,0.6); font-size: 12px;">سيتم التحويل محليًا بدون سيرفر</p>
        </div>
        
        <input type="file" id="fileInput" accept=".webm,video/webm">
        
        <div id="fileInfo" class="file-info" style="display: none;">
            <p style="margin: 0 0 10px 0; font-size: 13px; color: rgba(255,255,255,0.8);">الملف المختار:</p>
            <p id="fileName" style="margin: 0 0 5px 0; font-weight: bold; color: #c5a059;"></p>
            <p id="fileSize" style="margin: 0; font-size: 12px; color: rgba(255,255,255,0.7);"></p>
        </div>
        
        <button id="convertBtn" class="btn" disabled>
            <i class="fas fa-sync-alt"></i> تحويل إلى MP4
        </button>
        
        <div id="status" class="status"></div>
        <div id="output"></div>
    </div>

    <script type="module">
        import { createFFmpeg, fetchFile } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.7/+esm';

        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const status = document.getElementById('status');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBox = document.getElementById('uploadBox');
        const output = document.getElementById('output');

        let selectedFile = null;
        let ffmpeg = null;

        const log = (message) => {
            output.innerHTML += message + '
';
            output.scrollTop = output.scrollHeight;
        };

        // تحميل ffmpeg عند البدء
        async function loadFFmpeg() {
            status.innerHTML = '<span class="spinner">⏳</span> جاري تحميل ffmpeg.wasm لأول مرة... (قد يستغرق دقيقة)';
            convertBtn.disabled = true;
            
            ffmpeg = createFFmpeg({ 
                log: true,
                logger: ({ message }) => log(message)
            });
            
            try {
                await ffmpeg.load();
                status.innerHTML = '✅ ffmpeg جاهز! اختر ملفًا للتحويل';
                convertBtn.disabled = false;
            } catch (error) {
                status.innerHTML = `❌ خطأ في تحميل ffmpeg: ${error.message}`;
                log('Error: ' + error.message);
            }
        }

        loadFFmpeg();

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                fileName.textContent = selectedFile.name;
                fileSize.textContent = `الحجم: ${(selectedFile.size / 1024 / 1024).toFixed(2)} ميجابايت`;
                fileInfo.style.display = 'block';
                uploadBox.style.display = 'none';
                
                if (ffmpeg && ffmpeg.isLoaded()) {
                    convertBtn.disabled = false;
                }
                status.innerHTML = '✅ ملف جاهز للتحويل';
            }
        });

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile || !ffmpeg || !ffmpeg.isLoaded()) return;

            convertBtn.disabled = true;
            output.innerHTML = '';
            status.innerHTML = '<span class="spinner">⏳</span> جاري التحويل... يرجى الانتظار';

            try {
                const inputName = 'input.webm';
                const outputName = 'output.mp4';

                log('قراءة الملف...');
                ffmpeg.FS('writeFile', inputName, await fetchFile(selectedFile));

                log('جاري التحويل (webm → mp4)...');
                log('الترميز: H264 + AAC، جودة صوت عالية');
                
                // التحويل بنفس إعدادات ffmpeg التي ذكرتها
                await ffmpeg.run(
                    '-i', inputName,
                    '-c:v', 'libx264',      // فيديو H264
                    '-preset', 'medium',
                    '-crf', '23',
                    '-c:a', 'aac',          // صوت AAC (بدلاً من libmp3lame للـ MP4)
                    '-b:a', '192k',
                    '-movflags', '+faststart',
                    outputName
                );

                log('جاري تجهيز الملف للتحميل...');
                const data = ffmpeg.FS('readFile', outputName);

                const mp4Blob = new Blob([data.buffer], { type: 'video/mp4' });
                const url = URL.createObjectURL(mp4Blob);
                const downloadName = selectedFile.name.replace('.webm', '.mp4');

                const a = document.createElement('a');
                a.href = url;
                a.download = downloadName;
                document.body.appendChild(a);
                a.click();

                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    // تنظيف الذاكرة
                    try {
                        ffmpeg.FS('unlink', inputName);
                        ffmpeg.FS('unlink', outputName);
                    } catch(e) {}
                    
                    status.innerHTML = '✅ <strong>تم التحويل بنجاح!</strong><br>⊗ تم تحميل الملف MP4';
                    convertBtn.disabled = false;
                }, 100);

                log('✅ تم التحويل بنجاح!');

            } catch (error) {
                console.error('Error:', error);
                log('Error: ' + error.message);
                status.innerHTML = `❌ <strong>خطأ:</strong> ${error.message}`;
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
